name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.24"

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet and size budget
        run: make lint

      - name: Test
        run: go test -race ./...

      - name: Build
        run: make build

      - name: Size and startup budgets
        run: make bench

  offline:
    name: Tests need no network
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      # nemuz claims its whole suite runs without touching the network: every
      # provider test uses httptest, and every replay reads a recording. This
      # job makes that a fact rather than an intention.
      #
      # The isolation is a container with no network interface but loopback,
      # rather than a firewall rule on the runner. Blocking egress on the runner
      # also cuts the runner's own connection to GitHub, so the job hangs
      # instead of reporting — which is exactly what the first version of this
      # file did.
      - name: Fetch dependencies before isolating
        run: go mod download

      - name: Run the suite with no network
        run: |
          docker run --rm --network none \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/src" -w /src \
            -v "$(go env GOMODCACHE):/gomodcache" \
            -e GOMODCACHE=/gomodcache \
            -e GOCACHE=/tmp/gocache \
            -e HOME=/tmp \
            "golang:${GO_VERSION}" \
            go test -count=1 ./...

      - name: Confirm the container really had no network
        run: |
          if docker run --rm --network none "golang:${GO_VERSION}" \
             timeout 5 curl -sSf https://proxy.golang.org > /dev/null 2>&1; then
            echo "the isolated container reached the internet; this job proves nothing"
            exit 1
          fi
          echo "confirmed: no outbound traffic is possible in that container"

  sandbox:
    name: Sandbox is enforced
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Build
        run: make build

      # doctor spawns the tool worker and has it attempt a read outside its
      # workspace. A build that computes the right capability grants and never
      # applies them passes every other job and fails this one.
      - name: Verify tool confinement
        run: |
          ./bin/nemuz doctor
          ./bin/nemuz doctor | grep -q "sandbox    verified" || {
            echo "doctor did not verify tool confinement"
            exit 1
          }
