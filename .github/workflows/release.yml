name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # CI must build with the version go.mod names, not one Go fetched behind our
  # back. See .github/workflows/ci.yml for how that went wrong.
  GOTOOLCHAIN: local

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # goreleaser needs the full history to describe the tag.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          check-latest: true

      - uses: anchore/sbom-action/download-syft@v0

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
